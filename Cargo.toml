[package]
name = "crab"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "CRAB (Rust Audio Box) - a terminal audio player for local files, internet radio and Spotify, with a live spectrum analyzer"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["audio", "music", "player", "tui", "spectrum"]
categories = ["multimedia::audio", "command-line-utilities"]

[features]
default = ["spotify"]
spotify = [
    "dep:librespot-connect",
    "dep:librespot-core",
    "dep:librespot-metadata",
    "dep:librespot-oauth",
    "dep:librespot-playback",
    "dep:tokio",
]

[dependencies]
anyhow = "1"
base64 = "0.22"
crossterm = "0.29"
dirs = "7"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
libc = "0.2"
librespot-connect = { version = "0.8", optional = true }
librespot-core = { version = "0.8", optional = true }
librespot-metadata = { version = "0.8", optional = true }
librespot-oauth = { version = "0.8", optional = true }
librespot-playback = { version = "0.8", default-features = false, optional = true }
lofty = "0.25"
notify = "8.2.2"
ratatui = "0.30"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls"] }
rodio = "0.23"
rustfft = "6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = { version = "0.36", default-features = false, features = ["system"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"], optional = true }
toml = "1"
walkdir = "2"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
