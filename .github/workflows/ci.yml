name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        timeout-minutes: 10
        run: |
          apt_options=(
            -o Acquire::Retries=3
            -o Acquire::http::Timeout=20
            -o Acquire::https::Timeout=20
          )
          sudo apt-get "${apt_options[@]}" update --error-on=any
          sudo apt-get "${apt_options[@]}" install -y --no-install-recommends libasound2-dev pkg-config ffmpeg
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Test desktop installer
        run: make test-installer
      - name: Check formatting
        run: cargo fmt --check
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Test extended audio formats
        run: cargo test --locked ffmpeg::tests::decodes_and_seeks_real_formats -- --ignored
      - name: Build without Spotify support
        run: cargo build --locked --no-default-features
